services:
    monochrome-navidrome:
        image: ghcr.io/lozza/monochrome-navidrome:latest
        container_name: monochrome-navidrome
        pull_policy: always
        ports:
            - '${MONOCHROME_PORT:-3000}:4173'
        environment:
            # This address must be reachable from inside this container.
            # The host-gateway mapping below makes this default work on Linux/OMV.
            NAVIDROME_URL: '${NAVIDROME_URL:-http://host.docker.internal:4533}'
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        restart: unless-stopped
        healthcheck:
            test: ['CMD', 'wget', '--quiet', '--tries=1', '--spider', 'http://localhost:4173/']
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 15s
