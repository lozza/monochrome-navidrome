name: Lint Codebase

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

permissions:
    contents: read

jobs:
    lint:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v6

            - name: Setup Node
              uses: actions/setup-node@v6
              with:
                  node-version: '24'
                  cache: npm

            - name: Install dependencies
              run: npm ci --no-audit --no-fund

            - name: Check formatting
              run: npm run format:check

            - name: Run JS Lint
              run: npm run lint:js

            - name: Run CSS Lint
              run: npm run lint:css

            - name: Run HTML Lint
              run: npm run lint:html
