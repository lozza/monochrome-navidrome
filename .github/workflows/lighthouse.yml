name: Lighthouse (informational)

on:
    workflow_dispatch:
    push:
        branches: [main]

jobs:
    lighthouse:
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            - name: Checkout
              uses: actions/checkout@v6

            - name: Setup Node
              uses: actions/setup-node@v6
              with:
                  node-version: '24'
                  cache: npm

            - name: Install dependencies
              run: npm ci --no-audit --no-fund

            - name: Build
              run: npm run build

            - name: Run Lighthouse
              run: npx lhci autorun --config=lhci.yml

            - name: Upload results
              if: always()
              uses: actions/upload-artifact@v7
              with:
                  name: lighthouse-results
                  path: .lighthouseci/
