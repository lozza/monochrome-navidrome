name: Publish Phase 3 test image

on:
    push:
        branches:
            - feature/start-radio
    workflow_dispatch:

env:
    REGISTRY: ghcr.io
    IMAGE_NAME: lozza/monochrome-navidrome

jobs:
    publish:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write

        steps:
            - name: Check out repository
              uses: actions/checkout@v6

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v4

            - name: Log in to GitHub Container Registry
              uses: docker/login-action@v4
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Read application version
              id: app
              shell: bash
              run: |
                  version="$(jq -er '.version' package.json)"
                  printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

            - name: Build and publish test image
              uses: docker/build-push-action@v7
              with:
                  context: .
                  file: docker/Dockerfile
                  platforms: linux/amd64
                  push: true
                  tags: |
                      ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:phase3-test
                      ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:phase3-test-${{ github.sha }}
                  labels: |
                      org.opencontainers.image.title=Navichrome
                      org.opencontainers.image.version=${{ steps.app.outputs.version }}-phase3-test
                      org.opencontainers.image.revision=${{ github.sha }}
                      org.opencontainers.image.source=https://github.com/lozza/monochrome-navidrome
                  build-args: |
                      BUILD_COMMIT=${{ github.sha }}
                      APP_VERSION=${{ steps.app.outputs.version }}-phase3-test
