name: Beta bug report
description: Report a reproducible Navichrome problem.
title: '[BUG] '
labels: ['bug', 'needs-info']
body:
    - type: markdown
      attributes:
          value: |
              Do not include passwords, API/tunnel tokens, cookies, signed URLs, personal hostnames, or private library data.
    - type: input
      id: build
      attributes:
          label: Navichrome version and build
          description: Copy both values from Settings > About.
          placeholder: 0.1.0-beta.1 / abcdef123456
      validations:
          required: true
    - type: input
      id: navidrome
      attributes:
          label: Navidrome/OpenSubsonic version
          placeholder: Navidrome 0.x.y
      validations:
          required: true
    - type: textarea
      id: environment
      attributes:
          label: Environment
          description: Browser/version, device/OS, desktop or mobile viewport, Docker/Portainer, direct/reverse-proxy/Cloudflare.
      validations:
          required: true
    - type: input
      id: library
      attributes:
          label: Approximate library size
          description: Especially important for browsing, Singles, search, artwork, and performance reports.
          placeholder: About 10,000 tracks / 800 albums
      validations:
          required: false
    - type: textarea
      id: reproduction
      attributes:
          label: Reproduction steps
          placeholder: |
              1. Open ...
              2. Select ...
              3. Observe ...
      validations:
          required: true
    - type: textarea
      id: expected
      attributes:
          label: Expected behavior
      validations:
          required: true
    - type: textarea
      id: actual
      attributes:
          label: Actual behavior
      validations:
          required: true
    - type: textarea
      id: diagnostics
      attributes:
          label: Redacted diagnostics
          description: Console errors, HTTP status codes, image tag/digest, relevant non-secret Compose fields, screenshots, and timing.
          render: shell
      validations:
          required: false
    - type: checkboxes
      id: safety
      attributes:
          label: Safety check
          options:
              - label: I removed credentials, tokens, cookies, signed URLs, personal hostnames, and unwanted library details.
                required: true
