services:
    # Build the production Navichrome frontend from this checkout.
    monochrome:
        build:
            context: ..
            dockerfile: docker/Dockerfile
            args:
                BUILD_COMMIT: '${BUILD_COMMIT:?Set BUILD_COMMIT to the current git commit SHA}'
        container_name: monochrome
        ports:
            - '${MONOCHROME_PORT:-3002}:4173'
        environment:
            NAVIDROME_URL: '${NAVIDROME_URL:-http://host.docker.internal:4533}'
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        restart: unless-stopped
        networks:
            - monochrome-network
        healthcheck:
            test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:4173/']
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 15s

    # Development server -- only starts with: docker compose --profile dev up -d
    monochrome-dev:
        build:
            context: ..
            dockerfile: docker/Dockerfile.dev
        container_name: monochrome-dev
        profiles:
            - dev
        ports:
            - '${MONOCHROME_DEV_PORT:-5173}:5173'
        volumes:
            - ..:/app
            - /app/node_modules
        command: npm run dev -- --host 0.0.0.0
        networks:
            - monochrome-network

networks:
    monochrome-network:
        driver: bridge
