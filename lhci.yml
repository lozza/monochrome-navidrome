ci:
    collect:
        staticDistDir: ./dist
        numberOfRuns: 3
        settings:
            preset: desktop
            chromeFlags: '--no-sandbox --disable-gpu'

    assert:
        assertions:
            first-contentful-paint:
                - warn
                - maxNumericValue: 3000
            interactive:
                - warn
                - maxNumericValue: 7000
            lcp-lazy-loaded: off
            speed-index:
                - warn
                - maxNumericValue: 5000
            categories:accessibility:
                - warn
                - minScore: 0.85
            categories:best-practices:
                - warn
                - minScore: 0.85
            categories:seo:
                - warn
                - minScore: 0.85

    upload:
        target: temporary-public-storage
